name: wind-data

# GFS cycles 00/06/12/18Z are complete on NOMADS roughly 4 h 20 min later; run at +4h45m.
on:
  schedule:
    - cron: '45 4,10,16,22 * * *'
  workflow_dispatch:

concurrency:
  group: wind-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/gfs/requirements.txt
      - run: pip install -r scripts/gfs/requirements.txt
      # 6 tries x 120 s per file: a 404 (cycle not published yet) is retried, then AWS, then an older cycle.
      - name: Fetch and encode GFS wind
        run: python -I scripts/gfs/fetch_gfs.py --out public/data/wind.bin.gz --tries 6 --delay 120
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          SKIP_WIND_FETCH: '1'
      # Fresh GFS surface orography + land-sea mask on the same 1 deg grid, used only to verify that the
      # coastline, the terrain and the wind grid still line up. Never shipped to the browser.
      - name: Fetch GFS surface HGT + LAND for verification
        run: python -I scripts/gfs/fetch_gfs.py --frames 1 --out "$RUNNER_TEMP/unused.bin" --verify-out test/fixtures/gfs-verify-1p00.bin --tries 6 --delay 120
      - name: Verify the new wind file and the end-to-end georeferencing
        env:
          WIND_FILE: public/data/wind.bin.gz
        run: npx vitest run -c vitest.geo.config.ts test/geo/wind.spec.ts test/geo/alignment.spec.ts
      - name: Size guard (must stay under 1 MB)
        run: |
          size=$(wc -c < public/data/wind.bin.gz)
          echo "wind.bin.gz: $size bytes"
          test "$size" -lt 1048576
      - name: Publish to the single-commit wind-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(mktemp -d)
          cp public/data/wind.bin.gz "$out/wind.bin.gz"
          cd "$out"
          git init -q -b wind-data
          git config user.name "elkwire-wind-bot"
          git config user.email "wind-bot@users.noreply.github.com"
          git add wind.bin.gz
          git commit -q -m "wind: GFS snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" wind-data
      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret is not set; the site will not redeploy"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
      # Scheduled workflows are disabled after 60 days without repository activity; re-enable ourselves.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/wind.yml/enable" || true
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label wind-data --state open --json number --jq '.[0].number' > n.txt
          body="wind-data run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -s n.txt ]; then gh issue comment "$(cat n.txt)" --body "$body"
          else gh issue create --label wind-data --title "wind-data workflow is failing" --body "$body"; fi
